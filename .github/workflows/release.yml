name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v1.2.3
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: flconsole.sln
  TEST_PROJECT_PATH: tests/flconsole.Tests/flconsole.Tests.csproj
  APP_PROJECT_PATH: flconsole/flconsole.csproj

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            prerelease="false"
          else
            release_tag="${{ inputs.tag }}"
            prerelease="${{ inputs.prerelease }}"
          fi

          if [[ -z "${release_tag}" ]]; then
            echo "::error::Release tag is required."
            exit 1
          fi

          if [[ ! "${release_tag}" =~ ^v.+ ]]; then
            echo "::error::Release tag must start with v."
            exit 1
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Build and test
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-build

  publish:
    name: Publish ${{ matrix.runtime }}
    needs:
      - prepare
      - validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - linux-x64
          - linux-arm64
          - win-x64
          - osx-x64
          - osx-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish application
        shell: bash
        run: |
          output_dir="artifacts/${{ matrix.runtime }}/publish"
          dotnet publish "${{ env.APP_PROJECT_PATH }}" \
            --configuration Release \
            --runtime "${{ matrix.runtime }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            --output "${output_dir}"

      - name: Create archive
        shell: bash
        run: |
          archive_dir="artifacts/packages"
          archive_name="flconsole-${{ needs.prepare.outputs.tag }}-${{ matrix.runtime }}.zip"

          mkdir -p "${archive_dir}"
          cd "artifacts/${{ matrix.runtime }}/publish"
          zip -r "../../packages/${archive_name}" .

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: flconsole-${{ matrix.runtime }}
          path: artifacts/packages/flconsole-${{ needs.prepare.outputs.tag }}-${{ matrix.runtime }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: flconsole-*
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(artifacts/*.zip)

          if (( ${#files[@]} == 0 )); then
            echo "::error::No release packages were downloaded."
            exit 1
          fi

          if gh release view "${{ needs.prepare.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" --clobber
            edit_args=(
              release edit
              "${{ needs.prepare.outputs.tag }}"
              --title "${{ needs.prepare.outputs.tag }}"
            )

            if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
              edit_args+=(--prerelease)
            fi

            gh "${edit_args[@]}"
            exit 0
          fi

          args=(
            release create
            "${{ needs.prepare.outputs.tag }}"
            "${files[@]}"
            --title "${{ needs.prepare.outputs.tag }}"
            --generate-notes
            --target "${GITHUB_SHA}"
          )

          if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
